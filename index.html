        try {
          const res = await fetch("/api/send-lead", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          });
          if (!res.ok) {
            let msg = "Request failed";
            try { msg = (await res.json()).error || msg; } catch (e) {}

          }
          return { error: null };
        } catch (e) {
          return { error: e };
        }
      };
